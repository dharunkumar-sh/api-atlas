<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded Squircle Container -->
  <rect width="32" height="32" rx="7.5" fill="#35CFB7"/>

  <!-- Network Connection Lines -->
  <line x1="8.5" y1="16" x2="15" y2="9.5" stroke="#0E1726" stroke-width="2.25" stroke-linecap="round"/>
  <line x1="8.5" y1="16" x2="23.5" y2="16" stroke="#0E1726" stroke-width="2.25" stroke-linecap="round"/>
  <line x1="8.5" y1="16" x2="15" y2="22.5" stroke="#0E1726" stroke-width="2.25" stroke-linecap="round"/>

  <!-- Connected Network Nodes (Hollow Rings) -->
  <circle cx="8.5" cy="16" r="2.5" fill="#35CFB7" stroke="#0E1726" stroke-width="2"/>
  <circle cx="15" cy="9.5" r="2.5" fill="#35CFB7" stroke="#0E1726" stroke-width="2"/>
  <circle cx="23.5" cy="16" r="2.5" fill="#35CFB7" stroke="#0E1726" stroke-width="2"/>
  <circle cx="15" cy="22.5" r="2.5" fill="#35CFB7" stroke="#0E1726" stroke-width="2"/>
</svg>
